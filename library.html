<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Lesson Library | Patriot Command</title>

  <style>
    :root {
      --navy: #11284a;
      --red: #aa3235;
      --gold: #d3a84f;
      --white: #ffffff;
      --gray: #657184;
      --border: #d7dce3;
      --cream: #f7f2e8;
      --shadow: rgba(0, 0, 0, 0.13);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--navy);
      background: #e9edf2;
    }

    button {
      font: inherit;
    }

    .library-header {
      padding: 34px 24px;
      color: var(--white);
      text-align: center;
      background: var(--navy);
      border-bottom: 7px solid var(--red);
    }

    .library-header h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.5rem);
    }

    .library-header p {
      margin: 9px 0 0;
      color: var(--gold);
      font-weight: bold;
    }

    main {
      width: min(1100px, 94%);
      margin: 28px auto 50px;
    }

    .library-toolbar {
      margin-bottom: 22px;
      padding: 22px;
      background: var(--white);
      border-radius: 14px;
      box-shadow: 0 6px 18px var(--shadow);
    }

    .library-toolbar h2 {
      margin: 0 0 7px;
      color: var(--red);
    }

    .library-toolbar p {
      margin: 0;
      color: var(--gray);
    }

    .library-message {
      display: none;
      margin: 20px 0;
      padding: 16px;
      text-align: center;
      background: #fff0cf;
      border: 2px solid var(--gold);
      border-radius: 10px;
    }

    .library-message.show {
      display: block;
    }

    .lesson-library-list {
      display: grid;
      gap: 18px;
    }

    .lesson-card {
      padding: 22px;
      background: var(--white);
      border-left: 7px solid var(--red);
      border-radius: 13px;
      box-shadow: 0 6px 18px var(--shadow);
    }

    .lesson-card-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .lesson-card h3 {
      margin: 0 0 8px;
      color: var(--navy);
      font-size: 1.35rem;
    }

    .lesson-card-meta {
      margin: 3px 0;
      color: var(--gray);
    }

    .lesson-details-button {
      flex: 0 0 auto;
      padding: 11px 15px;
      color: var(--white);
      font-weight: bold;
      background: var(--navy);
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    .lesson-details-button:hover {
      background: var(--red);
    }

    .lesson-details {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 2px solid var(--border);
    }

    .lesson-details.show {
      display: grid;
      gap: 15px;
    }

    .lesson-detail-section {
      padding: 15px;
      background: var(--cream);
      border-radius: 9px;
    }

    .lesson-detail-section h4 {
      margin: 0 0 7px;
      color: var(--red);
    }

    .lesson-detail-section p {
      margin: 0;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .lesson-resource-links {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .lesson-resource-link {
      display: inline-block;
      padding: 9px 12px;
      color: var(--white);
      font-weight: bold;
      text-decoration: none;
      background: var(--navy);
      border-radius: 7px;
    }

    .lesson-resource-link:hover {
      background: var(--red);
    }

    .lesson-no-resources {
      color: var(--gray);
      font-style: italic;
    }

    @media (max-width: 650px) {
      .lesson-card-heading {
        align-items: stretch;
        flex-direction: column;
      }

      .lesson-details-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <header class="library-header">
    <h1>📚 Lesson Library</h1>

    <p>
      Find, review, reuse, and launch your saved lessons.
    </p>
  </header>

  <main>
    <section class="library-toolbar">
      <h2>Your Saved Lessons</h2>

      <p>
        Your newest archived lessons appear first.
      </p>
    </section>

    <div
      id="library-message"
      class="library-message"
    >
      Loading your saved lessons...
    </div>

    <section
      id="lesson-library-list"
      class="lesson-library-list"
      aria-live="polite"
    ></section>
  </main>

  <script src="js/navigation.js"></script>
  <script src="js/library.js"></script>
  <script src="js/library-search.js"></script>
</body>
</html>
